<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
  <title id="title">Dual Flywheel Diagram</title>
  <desc id="desc">Two connected circular flywheels representing properties and people around a central trust layer.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#39A9E5"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E6954A"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="none"/>

  <!-- Left flywheel -->
  <circle cx="185" cy="280" r="110" fill="#F4FBFF" stroke="#39A9E5" stroke-width="4"/>
  <circle cx="185" cy="280" r="58" fill="#ffffff" stroke="#CFEAF8" stroke-width="3"/>
  <path d="M102 206 A110 110 0 0 1 252 206" fill="none" stroke="#39A9E5" stroke-width="6" marker-end="url(#arrowBlue)"/>
  <path d="M266 351 A110 110 0 0 1 116 351" fill="none" stroke="#39A9E5" stroke-width="6" marker-end="url(#arrowBlue)"/>

  <!-- Right flywheel -->
  <circle cx="375" cy="280" r="110" fill="#FFF8EE" stroke="#E6954A" stroke-width="4"/>
  <circle cx="375" cy="280" r="58" fill="#ffffff" stroke="#F4D8B5" stroke-width="3"/>
  <path d="M292 206 A110 110 0 0 1 442 206" fill="none" stroke="#E6954A" stroke-width="6" marker-end="url(#arrowOrange)"/>
  <path d="M456 351 A110 110 0 0 1 306 351" fill="none" stroke="#E6954A" stroke-width="6" marker-end="url(#arrowOrange)"/>

  <!-- Shared trust core -->
  <circle cx="280" cy="280" r="44" fill="#FFFFFF" stroke="#AFC3D9" stroke-width="3"/>
  <rect x="256" y="256" width="30" height="30" rx="6" fill="#00B4D8" opacity="0.9"/>
  <rect x="274" y="244" width="30" height="30" rx="6" fill="#E8651A" opacity="0.85"/>
  <rect x="268" y="268" width="26" height="26" rx="5" fill="#8B3FA0" opacity="0.8"/>

  <!-- Connector -->
  <path d="M240 280 L320 280" stroke="#9FB4CB" stroke-width="3" stroke-dasharray="6 6"/>
</svg>
